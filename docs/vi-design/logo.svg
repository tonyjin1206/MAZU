<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 海浪 M 形主标（两股相拥的波浪 = 妈祖保佑 + 贸易之路） -->
  <path d="
    M 28,140 
    C 28,140 40,75 65,55 
    C 85,39 100,45 100,45 
    C 100,45 115,39 135,55 
    C 160,75 172,140 172,140 
    C 172,140 135,110 100,95 
    C 65,110 28,140 28,140 Z
  " fill="url(#logoGrad)" opacity="0.92"/>

  <!-- 内嵌保护/祝福元素 — 浪花/船舵/光晕 -->
  <circle cx="100" cy="68" r="22" fill="url(#innerGrad)" opacity="0.15"/>
  <circle cx="100" cy="68" r="22" stroke="url(#innerGrad)" stroke-width="2" opacity="0.4"/>

  <!-- 罗盘星/指路星（妈祖保佑，出海平安） -->
  <g transform="translate(100,68)">
    <!-- 菱形星 -->
    <path d="M0,-9 L6,0 L0,9 L-6,0 Z" fill="url(#starGrad)"/>
    <!-- 四角光芒 -->
    <path d="M6,0 L14,0" stroke="url(#starGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M-6,0 L-14,0" stroke="url(#starGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M0,6 L0,14" stroke="url(#starGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M0,-6 L0,-14" stroke="url(#starGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 底部波浪线（贸易航线） -->
  <path d="M 12,148 Q 40,138 65,148 Q 90,158 115,148 Q 140,138 165,148 Q 180,153 188,148" 
        stroke="url(#waveLineGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <defs>
    <linearGradient id="logoGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#132d4a"/>
      <stop offset="35%" stop-color="#1e40af"/>
      <stop offset="65%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="waveLineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
