<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <!-- 1. 工作台 / Dashboard -->
    <g id="mts-dashboard">
      <rect x="3" y="3" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.9"/>
      <rect x="15" y="3" width="9" height="5" rx="1.5" fill="currentColor" opacity="0.6"/>
      <rect x="15" y="11" width="9" height="13" rx="1.5" fill="currentColor" opacity="0.7"/>
      <rect x="3" y="15" width="9" height="9" rx="1.5" fill="currentColor" opacity="0.5"/>
    </g>

    <!-- 2. 基础档案 / Foundation -->
    <g id="mts-foundation">
      <path d="M12 3L3 8v8l9 5 9-5V8l-9-5z" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <rect x="9" y="11" width="6" height="8" rx="1" fill="currentColor" opacity="0.7"/>
      <circle cx="12" cy="7" r="2" fill="currentColor" opacity="0.8"/>
    </g>

    <!-- 3. 客户管理 / Customer -->
    <g id="mts-customer">
      <circle cx="12" cy="8" r="4" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="8" r="2.5" fill="currentColor" opacity="0.7"/>
    </g>

    <!-- 4. 供应商管理 / Supplier -->
    <g id="mts-supplier">
      <rect x="4" y="6" width="16" height="12" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="9" r="1.5" fill="currentColor" opacity="0.6"/>
    </g>

    <!-- 5. 物料管理 / Material -->
    <g id="mts-material">
      <path d="M5 8l7-4 7 4v8l-7 4-7-4V8z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor" opacity="0.6"/>
      <path d="M12 6v3M12 15v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 6. 产品档案 / Product -->
    <g id="mts-product">
      <rect x="5" y="4" width="14" height="16" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <rect x="8" y="7" width="8" height="3" rx="1" fill="currentColor" opacity="0.6"/>
      <path d="M8 13h8M8 16h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 7. BOM管理 / BOM -->
    <g id="mts-bom">
      <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.6"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.4"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.3"/>
      <path d="M10 6.5h3M10 17.5h3M18 10v3M6 10v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 8. 工序管理 / Process -->
    <g id="mts-process">
      <circle cx="7" cy="12" r="3" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="17" cy="7" r="3" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="17" cy="17" r="3" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9.5 10.5l4.5-3M9.5 13.5l4.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="7" cy="12" r="1.5" fill="currentColor" opacity="0.7"/>
      <circle cx="17" cy="7" r="1.5" fill="currentColor" opacity="0.7"/>
      <circle cx="17" cy="17" r="1.5" fill="currentColor" opacity="0.7"/>
    </g>

    <!-- 9. HS编码 / HS Code -->
    <g id="mts-hs-code">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="12" y="15" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="bold">HS</text>
    </g>

    <!-- 10. 销售管理 / Sales -->
    <g id="mts-sales">
      <path d="M20 12c0 4.5-3.5 8-8 8s-8-3.5-8-8 3.5-8 8-8 8 3.5 8 8z" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9 16l6-8M11 9h4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor" opacity="0.6"/>
    </g>

    <!-- 11. 采购管理 / Purchase -->
    <g id="mts-purchase">
      <rect x="4" y="6" width="16" height="12" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 14V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- 12. 生产管理 / Production -->
    <g id="mts-production">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 8h3v3H8z" fill="currentColor" opacity="0.6"/>
      <path d="M13 8h3v3h-3z" fill="currentColor" opacity="0.4"/>
      <path d="M8 13h3v3H8z" fill="currentColor" opacity="0.5"/>
      <path d="M13 13h3v3h-3z" fill="currentColor" opacity="0.3"/>
    </g>

    <!-- 13. 库存管理 / Inventory -->
    <g id="mts-inventory">
      <rect x="3" y="5" width="7" height="14" rx="1.5" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <rect x="14" y="3" width="7" height="16" rx="1.5" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="5" width="7" height="4" rx="1" fill="currentColor" opacity="0.6"/>
      <rect x="14" y="3" width="7" height="4" rx="1" fill="currentColor" opacity="0.5"/>
      <path d="M8 13h-2M8 16h-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M19 11h-2M19 14h-2M19 17h-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- 14. 退税管理 / Tax Refund -->
    <g id="mts-tax-refund">
      <path d="M6 4h12l2 3v13a2 2 0 01-2 2H6a2 2 0 01-2-2V7l2-3z" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 10v8M8 14l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 15. 系统管理 / System -->
    <g id="mts-system">
      <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1l2.1-2.1M17 7l2.1-2.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 16. 管理 / Admin -->
    <g id="mts-admin">
      <circle cx="12" cy="9" r="4" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M12 9l2 2-2 2-2-2 2-2z" fill="currentColor" opacity="0.6"/>
    </g>

    <!-- 17. 驾驶舱 / Cockpit -->
    <g id="mts-cockpit">
      <path d="M3 18l4-6 4 3 5-7 5 10H3z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="12" cy="6" r="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
      <path d="M10 4l2-2 2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 18. 订单 / Order -->
    <g id="mts-order">
      <rect x="5" y="3" width="14" height="18" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 7h8M8 11h8M8 15h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- 19. 发票 / Invoice -->
    <g id="mts-invoice">
      <rect x="5" y="3" width="14" height="18" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9 14l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="8" y="6" width="8" height="3" rx="1" fill="currentColor" opacity="0.4"/>
    </g>

    <!-- 20. 付款 / Payment -->
    <g id="mts-payment">
      <rect x="3" y="8" width="18" height="10" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="13" r="3" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="12" cy="13" r="1.5" fill="currentColor" opacity="0.6"/>
      <path d="M5 6l7-3 7 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 21. 入库 / Receipt -->
    <g id="mts-receipt">
      <path d="M12 3l7 4v10l-7 4-7-4V7l7-4z" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 10v6M9 13l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 22. 出库 / Delivery -->
    <g id="mts-delivery">
      <path d="M12 3l7 4v10l-7 4-7-4V7l7-4z" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 16v-6M9 13l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 23. 财务 / Finance -->
    <g id="mts-finance">
      <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <text x="12" y="16" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.8" font-weight="bold">¥</text>
    </g>

    <!-- 24. 报表 / Report -->
    <g id="mts-report">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 16V8h3v8H8z" fill="currentColor" opacity="0.5"/>
      <path d="M12 16v-5h3v5h-3z" fill="currentColor" opacity="0.4"/>
      <path d="M16 16v-3h3v3h-3z" fill="currentColor" opacity="0.3"/>
    </g>

    <!-- 25. 审批 / Approve -->
    <g id="mts-approve">
      <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 26. 船运 / Shipping -->
    <g id="mts-shipping">
      <path d="M4 17c0-2 2-4 8-4s8 2 8 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M8 17v-4M16 17v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M5 14l2-3h10l2 3" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="12" cy="9" r="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.2"/>
    </g>
  </defs>
</svg>
